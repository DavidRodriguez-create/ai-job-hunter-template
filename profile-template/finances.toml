# "Is it worth it?" model (optional feature — see docs/worth-it.md).
#   monthly savings = net salary (after tax & social) − city cost of living − your fixed costs
# Every number is a ROUGH ESTIMATE (2025/2026, single person, no kids). Edit anything that looks off;
# for a real offer, check the tax with an official calculator (links at the bottom).
# City amounts are in that city's own currency. Results are shown in your home_currency.

[me]
home_currency = "EUR"         # currency you think in / your fixed costs are in (EUR, USD, GBP, CHF…)
min_gain_per_month = 300      # optional filter: a job must beat your current savings by at least this

[me.fixed_monthly]            # costs that follow you wherever you live, per month, in home_currency
# examples — replace with yours, or delete the lines you don't have:
loan_or_mortgage = 0
insurance = 0
subscriptions = 0

# Your current job, used as the comparison point. city must be one of the [city.X] blocks below
# (add yours if it's missing). gross = yearly gross salary in that city's currency.
# extras_net_year = yearly perks paid on top (meal vouchers, bonus, transport allowance…), net.
[baseline]
city = "Paris"
gross = 50000
extras_net_year = 0

# ---------------------------------------------------------------- taxes
# [gross, share of gross lost to income tax + employee social contributions]; interpolated linearly.
