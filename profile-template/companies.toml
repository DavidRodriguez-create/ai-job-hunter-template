# Companies to watch. Each needs the ATS ("greenhouse" | "lever" | "ashby" | "smartrecruiters" |
# "workday" | "amazon" | "jibe" | "eightfold") and the board slug (the part after the domain in their careers URL).
# workday: slug = the whole careers URL, e.g. "https://acme.wd5.myworkdayjobs.com/External"
# amazon:  slug = job categories, e.g. "software-development" (or "all"); jibe: slug = the careers site host
# eightfold: slug = the careers search URL with domain and filters (see docs/find-jobs.md#add-a-company)
# Workday, Amazon, Jibe and Eightfold sites need an account to apply: see docs/apply.md#company-portals.
# Check new entries with:  python scripts/fetch_jobs.py --probe --only <name>
# Set enabled = false to pause one.

